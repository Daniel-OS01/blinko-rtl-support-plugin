name: Integration Tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install Dependencies
      run: bun install

    - name: Run Integration Tests
      # tests/renderer.test.ts is excluded — it imports src/renderer.ts and
      # src/config.ts which were removed (orphan files). Component tests live
      # under test-unit.yml; dynamic CSS tests are covered here.
      run: bun test tests/integration/ tests/verify_dynamic_rtl.test.ts
