name: Comprehensive Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-all:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        bun install
        pip install playwright
        playwright install --with-deps chromium

    - name: Type Check
      run: bun x tsc --noEmit

    - name: Run All Tests (excluding orphan renderer tests)
      # tests/renderer.test.ts is excluded — it imports src/renderer.ts and
      # src/config.ts which were removed as unused orphan files. All other
      # test directories and files are included.
      run: |
        bun test \
          tests/unit/ \
          tests/integration/ \
          tests/services/ \
          tests/utils/ \
          tests/components/ \
          tests/strategies.test.ts \
          tests/strategies_extra.test.ts \
          tests/regex_config.test.ts \
          tests/verify_dynamic_rtl.test.ts

    - name: Build Check & Bundle Analysis
      run: bun run build:prod

    - name: Run Visual & Mobile Verification
      # continue-on-error: visual verification needs a display/browser environment
      # which may not be available in all CI contexts; don't fail the whole suite.
      continue-on-error: true
      run: |
        if [ -f "verification/verify_rtl_ui.py" ]; then
          python verification/verify_rtl_ui.py
        else
          echo "Verification script not found, skipping."
        fi

    - name: Upload Verification Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verification-screenshots
        path: verification/*.png
