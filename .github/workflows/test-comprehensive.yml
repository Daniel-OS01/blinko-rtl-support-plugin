# ─── Workflow: Comprehensive CI Pipeline ──────────────────────────────────────
#
# Jobs (in execution order):
#   typecheck → Fail fast on TypeScript errors before running heavier jobs
#   test      → Unit + service + integration tests (needs: typecheck)
#   build     → Production bundle + size gate (needs: typecheck)
#   visual    → Playwright screenshot verification (needs: build, non-blocking)
#   compat    → Bun version matrix (independent, non-blocking)
#   maintenance → Manual-only action version check (workflow_dispatch only)
#
# Key design decisions:
#   - bun-version pinned to "1.2.5" for reproducible builds
#   - --frozen-lockfile with graceful fallback for lockfile version drift
#   - FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 enabled to proactively run JavaScript actions on Node.js 24
#   - Bundle size gate: JS > 400kB fails the build job
#   - All jobs upload artifacts on failure for debugging
#   - concurrency group cancels duplicate branch runs
#
# Maintenance:
#   - Regenerate bun.lockb: `bun install` locally with Bun 1.2.5 then commit
#   - Node.js 24 deadline: June 2, 2026 — upgrade checkout/cache to v5
# ──────────────────────────────────────────────────────────────────────────────
name: Comprehensive Tests

on:
  push:
    branches: [ "main", "claude/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel any in-progress run for the same branch/PR to avoid wasted minutes
env:
  # Opt in JavaScript actions to the Node.js 24 runtime ahead of GitHub's
  # default migration date (June 2, 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: TypeScript type-check ─────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5  

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Cache Bun dependencies
        uses: actions/cache@v4  
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install Dependencies (with retry)
        shell: bash
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=5
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Install attempt $attempt/$MAX_RETRIES"
            if bun install --frozen-lockfile 2>&1; then
              echo "✅ Installed from frozen lockfile"
              break
            elif [ $attempt -eq $MAX_RETRIES ]; then
              echo "::warning::All frozen-lockfile attempts failed, falling back to bun install"
              bun install
            else
              echo "::warning::Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
          done

      - name: Type Check
        run: bun x tsc --noEmit

  # ─── Job 2: Unit + Service + Integration Tests ────────────────────────────
  test:
    name: Run All Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run after typecheck so we don't waste test minutes on type-broken code
    needs: typecheck

    steps:
      - uses: actions/checkout@v5  

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Cache Bun dependencies
        uses: actions/cache@v4  
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install Dependencies (with retry)
        shell: bash
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=5
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Install attempt $attempt/$MAX_RETRIES"
            if bun install --frozen-lockfile 2>&1; then
              echo "✅ Installed from frozen lockfile"
              break
            elif [ $attempt -eq $MAX_RETRIES ]; then
              echo "::warning::All frozen-lockfile attempts failed, falling back to bun install"
              bun install
            else
              echo "::warning::Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
          done

      - name: Run All Tests (excluding orphan renderer tests)
        # tests/renderer.test.ts is excluded — it imports src/renderer.ts and
        # src/config.ts which were removed as unused orphan files. All other
        # test directories and files are included.
        shell: bash
        run: |
          bun test \
            tests/unit/ \
            tests/integration/ \
            tests/services/ \
            tests/utils/ \
            tests/components/ \
            tests/strategies.test.ts \
            tests/strategies_extra.test.ts \
            tests/regex_config.test.ts \
            tests/verify_dynamic_rtl.test.ts \
            --coverage \
            --timeout 30000

      - name: Export JUnit report
        if: always()
        shell: bash
        run: |
          bun test tests/unit/ tests/integration/ tests/services/ tests/utils/ tests/components/ tests/strategies.test.ts tests/strategies_extra.test.ts tests/regex_config.test.ts tests/verify_dynamic_rtl.test.ts --reporter junit > test-results/junit.xml 2>&1 || true

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-logs-${{ github.run_id }}
          path: |
            *.log
            test-results/
          retention-days: 7

  # ─── Job 3: Build ─────────────────────────────────────────────────────────
  build:
    name: Build & Bundle Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck

    steps:
      - uses: actions/checkout@v5  

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Cache Bun dependencies
        uses: actions/cache@v4  
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install Dependencies (with retry)
        shell: bash
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=5
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Install attempt $attempt/$MAX_RETRIES"
            if bun install --frozen-lockfile 2>&1; then
              echo "✅ Installed from frozen lockfile"
              break
            elif [ $attempt -eq $MAX_RETRIES ]; then
              echo "::warning::All frozen-lockfile attempts failed, falling back to bun install"
              bun install
            else
              echo "::warning::Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
          done

      - name: Production Build
        run: bun run build:prod

      - name: Check Bundle Size
        shell: bash
        run: |
          get_file_size() {
            local file="$1"
            if stat -c %s "$file" >/dev/null 2>&1; then
              stat -c %s "$file"
            else
              stat -f %z "$file"
            fi
          }

          JS_FILE=$(ls dist/*.js 2>/dev/null | head -n 1)
          CSS_FILE=$(ls dist/*.css 2>/dev/null | head -n 1)

          if [ -z "$JS_FILE" ] || [ -z "$CSS_FILE" ]; then
            echo "::error::Expected dist/*.js and dist/*.css output files were not found"
            exit 1
          fi

          JS_SIZE=$(get_file_size "$JS_FILE")
          CSS_SIZE=$(get_file_size "$CSS_FILE")
          echo "JS bundle (${JS_FILE}): ${JS_SIZE} bytes"
          echo "CSS bundle (${CSS_FILE}): ${CSS_SIZE} bytes"
          # Fail if JS bundle exceeds 400 kB uncompressed (current ~228 kB)
          if [ "$JS_SIZE" -gt 409600 ]; then
            echo "::error::JS bundle ${JS_SIZE} bytes exceeds 400 kB limit"
            exit 1
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          retention-days: 7

  # ─── Job 4: Visual Verification (optional, non-blocking) ──────────────────
  visual:
    name: Visual & Mobile Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # Non-blocking — visual tests require a browser display which may be absent
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5  

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Bun dependencies
        uses: actions/cache@v4  
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install Dependencies (with retry)
        shell: bash
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=5
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Install attempt $attempt/$MAX_RETRIES"
            if bun install --frozen-lockfile 2>&1; then
              echo "✅ Installed from frozen lockfile"
              break
            elif [ $attempt -eq $MAX_RETRIES ]; then
              echo "::warning::All frozen-lockfile attempts failed, falling back to bun install"
              bun install
            else
              echo "::warning::Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
          done
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Visual Verification
        shell: bash
        run: |
          if [ -f "verification/verify_rtl_ui.py" ]; then
            python verification/verify_rtl_ui.py
          else
            echo "Verification script not found, skipping."
          fi

      - name: Upload Verification Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-screenshots-${{ github.run_id }}
          path: verification/*.png
          retention-days: 7
          if-no-files-found: ignore

  # ─── Job 5: Compatibility Matrix ──────────────────────────────────────────
  compat:
    name: Compatibility — Bun ${{ matrix.bun-version }}
    runs-on: ubuntu-latest
    continue-on-error: true        # informational only — won't block merge
    timeout-minutes: 15
    strategy:
      matrix:
        bun-version: ["1.1.38"]    # last stable 1.1.x — oldest supported
    steps:
      - uses: actions/checkout@v5  

      - name: Setup Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install Dependencies
        shell: bash
        run: bun install            # no --frozen-lockfile on compat matrix

      - name: Run Tests
        shell: bash
        run: |
          bun test \
            tests/unit/ \
            tests/services/ \
            tests/strategies.test.ts \
            --timeout 30000

  # ─── Job 6: Maintenance ───────────────────────────────────────────────────
  maintenance:
    name: Check Action Version Freshness
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Report pinned action versions
        shell: bash
        run: |
          echo "Pinned versions in use:"
          echo "  actions/checkout@v5     → check https://github.com/actions/checkout/releases"
          echo "  actions/cache@v4        → check https://github.com/actions/cache/releases"
          echo "  oven-sh/setup-bun@v2   → check https://github.com/oven-sh/setup-bun/releases"
          echo "  actions/upload-artifact@v4"
          echo "  actions/setup-python@v5"
          echo ""
          echo "Node.js 24 migration deadline: June 2, 2026"
